{{- /* The analyzer pool's headless Service: the API resolves it to every ready pod and spreads images over them itself
       (a ClusterIP would pin its keep-alive connections to one pod, and finalize must reach the pod that measured).
       The pods read any path they're given, so only the API may reach them. The library chart has neither piece. */ -}}
{{- $lib := index .Values "mononen-library-chart" -}}
{{- $ns := $lib.global.namespace -}}
apiVersion: v1
kind: Service
metadata:
  name: photosort-analyzer-pool
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: photosort-analyzer
    app.kubernetes.io/component: analyzer
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: photosort-analyzer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8090
      targetPort: 8090
{{- if .Values.analyzerPool.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: photosort-analyzer
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: photosort-analyzer
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: photosort-api
      ports:
        - port: 8090
          protocol: TCP
{{- end }}
