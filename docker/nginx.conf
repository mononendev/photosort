server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://photosort-api:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /media/ {
        proxy_pass http://photosort-api:8080;
        proxy_http_version 1.1;
        proxy_cache_valid 200 1d;
    }
}
